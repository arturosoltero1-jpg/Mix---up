name: Compilar escritorio (Windows y Linux)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias de escritorio
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Empaquetar
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: mix-up-ear-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
